
name: CarLoca Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: CarLoca Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Android Projekt bauen
        run: gradle assembleDebug --stacktrace

      - name: APK-Datei prüfen und umbenennen
        run: |
          echo "Suche nach erstellten APK-Dateien:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          cp app/build/outputs/apk/debug/app-debug.apk CarLoca.apk

          echo "CarLoca.apk wurde erstellt."
          ls -lh CarLoca.apk

      - name: CarLoca APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CarLoca-APK
          path: CarLoca.apk
          if-no-files-found: error
          retention-days: 7
