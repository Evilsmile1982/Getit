
name: CARLOCA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: CARLOCA Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: CARLOCA Signaturschlüssel wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"

          mkdir -p "$RUNNER_TEMP/carloca"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/carloca/carloca-upload.jks"

          test -s "$RUNNER_TEMP/carloca/carloca-upload.jks"
          chmod 600 "$RUNNER_TEMP/carloca/carloca-upload.jks"

          echo "Signaturschlüssel wurde bereitgestellt."

      - name: Android APK und signiertes AAB bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CARLOCA_KEYSTORE_FILE: ${{ runner.temp }}/carloca/carloca-upload.jks
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          gradle assembleDebug bundleRelease --stacktrace

      - name: APK-Datei prüfen und umbenennen
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          cp app/build/outputs/apk/debug/app-debug.apk CarLoca.apk

          echo "CarLoca.apk wurde erstellt."
          ls -lh CarLoca.apk

      - name: CARLOCA APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CARLOCA-APK
          path: CarLoca.apk
          if-no-files-found: error
          retention-days: 7

      - name: Signiertes Google-Play-AAB prüfen
        run: |
          set -euo pipefail

          test -f app/build/outputs/bundle/release/app-release.aab

          echo "Signiertes AAB wurde erstellt."
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: CARLOCA Google-Play-AAB hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CARLOCA-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
