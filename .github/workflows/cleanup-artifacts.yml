
name: CARLOCA Artifact Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Alte Build-Artefakte bereinigen
    runs-on: ubuntu-latest

    steps:
      - name: Alte Artefakte löschen und neueste behalten
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const groups = new Map();

            for (const artifact of artifacts) {
              if (artifact.expired) continue;

              if (/keystore|signing|base64/i.test(artifact.name)) {
                core.info(`Geschützt: ${artifact.name}`);
                continue;
              }

              if (!groups.has(artifact.name)) {
                groups.set(artifact.name, []);
              }

              groups.get(artifact.name).push(artifact);
            }

            let deleted = 0;

            for (const [name, items] of groups.entries()) {
              items.sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              );

              for (const artifact of items.slice(1)) {
                core.info(`Lösche altes Artefakt: ${name}`);

                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });

                deleted++;
              }
            }

            core.info(
              `Bereinigung abgeschlossen. Gelöschte Artefakte: ${deleted}`
            );
