
name: CARLOCA Artifact Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Alte Build-Artefakte bereinigen
    runs-on: ubuntu-latest

    steps:
      - name: Alte Artefakte löschen
        uses: actions/github-script@v7
        with:
          script: |
            const daysToKeep = 7;
            const cutoff =
              Date.now() - daysToKeep * 24 * 60 * 60 * 1000;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            let deleted = 0;
            let kept = 0;

            for (const artifact of artifacts) {
              const name = artifact.name.toUpperCase();

              // Signaturdateien vorsichtshalber schützen.
              if (
                name.includes("KEYSTORE") ||
                name.includes("SIGNING") ||
                name.includes("UPLOAD-KEY")
              ) {
                core.info(`Geschützt: ${artifact.name}`);
                kept++;
                continue;
              }

              const createdAt =
                new Date(artifact.created_at).getTime();

              if (createdAt < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });

                core.info(`Gelöscht: ${artifact.name}`);
                deleted++;
              } else {
                core.info(`Behalten: ${artifact.name}`);
                kept++;
              }
            }

            core.info("Bereinigung abgeschlossen.");
            core.info(`Gelöscht: ${deleted}`);
            core.info(`Behalten: ${kept}`);
