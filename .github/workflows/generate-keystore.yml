
name: CARLOCA Signaturschlüssel erstellen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: CARLOCA Upload Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signaturschlüssel erzeugen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          keytool -genkeypair -v \
            -keystore carloca-upload.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -alias carloca-upload \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CARLOCA, OU=Mobile, O=CARLOCA, L=Vienna, ST=Vienna, C=AT"

          keytool -list \
            -keystore carloca-upload.jks \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Signaturschlüssel als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: CARLOCA-Upload-Keystore
          path: carloca-upload.jks
          if-no-files-found: error
          retention-days: 1
