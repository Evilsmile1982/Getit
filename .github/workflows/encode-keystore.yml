name: CARLOCA Keystore Base64 vorbereiten

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  encode:
    runs-on: ubuntu-latest

    steps:
      - name: Vorhandenen Keystore herunterladen
        uses: actions/download-artifact@v4
        with:
          name: CARLOCA-Upload-Keystore
          path: ./keystore
          run-id: 41893629221
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Base64 erzeugen
        run: |
          set -euo pipefail
          test -f ./keystore/carloca-upload.jks
          base64 -w 0 ./keystore/carloca-upload.jks > carloca-upload.jks.base64.txt
          test -s carloca-upload.jks.base64.txt
          echo "Base64-Datei wurde erstellt."
          wc -c carloca-upload.jks.base64.txt

      - name: Base64-Datei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: CARLOCA-KEYSTORE-BASE64
          path: carloca-upload.jks.base64.txt
          if-no-files-found: error
          retention-days: 1
