name: AutoCheck CUT2 modularisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CUT2 Baseline prüfen
        run: |
          git fetch --tags --force

          if ! git rev-parse CUT2-BASELINE >/dev/null 2>&1; then
            echo "FEHLER: CUT2-BASELINE wurde nicht gefunden."
            exit 1
          fi

          echo "CUT2-BASELINE vorhanden."

      - name: Kotlin-Datei sicher aufteilen
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          source_path = Path(
              "app/src/main/java/de/autocheck/app/MainActivity.kt"
          )

          if not source_path.exists():
              print("FEHLER: MainActivity.kt wurde nicht gefunden.")
              sys.exit(1)

          source = source_path.read_text(encoding="utf-8")

          file_map = {
              "Background": "components/UiConstants.kt",
              "Surface": "components/UiConstants.kt",
              "Muted": "components/UiConstants.kt",

              "Vehicle": "data/Vehicle.kt",
              "Repair": "data/Repair.kt",
              "Maintenance": "data/Maintenance.kt",
              "Pickerl": "data/Pickerl.kt",
              "TireSet": "data/TireSet.kt",

              "VehicleStore": "storage/VehicleStore.kt",
              "VisitedStore": "storage/VisitedStore.kt",

              "Screen": "screens/Screen.kt",
              "MenuItemData": "components/MenuItemData.kt",

              "MainActivity": "MainActivity.kt",

              "PickerlReceiver": "utils/PickerlReminder.kt",
              "schedulePickerlReminder": "utils/PickerlReminder.kt",
              "cancelPickerlReminder": "utils/PickerlReminder.kt",

              "migrateVehicleName": "utils/VehicleMigration.kt",

              "AutoCheckApp": "AutoCheckApp.kt",

              "HomeScreen": "screens/HomeScreen.kt",
              "VehicleScreen": "screens/VehicleScreen.kt",
              "RepairScreen": "screens/RepairScreen.kt",
              "PickerlScreen": "screens/PickerlScreen.kt",
              "MaintenanceScreen": "screens/MaintenanceScreen.kt",
              "TireScreen": "screens/TireScreen.kt",
              "OverviewScreen": "screens/OverviewScreen.kt",

              "MenuCard": "components/MenuCard.kt",
              "DetailScaffold": "components/DetailScaffold.kt",
              "VehicleImage": "components/VehicleImage.kt",
              "VehicleSelector": "components/VehicleSelector.kt",
              "CardForm": "components/CardForm.kt",
              "FormField": "components/FormField.kt",
              "FormButtons": "components/FormButtons.kt",
              "EmptyCard": "components/EmptyCard.kt",
              "RecordCard": "components/RecordCard.kt",
          }

          declaration_re = re.compile(
              r"""(?m)
              ^
              (?:
                  @[A-Za-z_][^\n]*
                  \n
              )*
              (?:
                  (?:
                      public|private|protected|internal|abstract|open|final|
                      data|sealed|enum|annotation|value|expect|actual|
                      suspend|inline|operator|infix|tailrec|external|const
                  )
                  \s+
              )*
              (?:class|interface|object|fun|val|var|typealias)
              \s+
              ([A-Za-z_][A-Za-z0-9_]*)
              \b
              """,
              re.VERBOSE
          )

          matches = list(
              declaration_re.finditer(source)
          )

          if not matches:
              print(
                  "FEHLER: Keine Top-Level-Deklarationen gefunden."
              )
              sys.exit(1)

          declarations = []

          for index, match in enumerate(matches):

              start = match.start()

              if index + 1 < len(matches):
                  end = matches[index + 1].start()
              else:
                  end = len(source)

              name = match.group(1)
              text = source[start:end].strip()

              declarations.append(
                  (name, text)
              )

          names = [
              name
              for name, _ in declarations
          ]

          missing = sorted(
              set(file_map) - set(names)
          )

          if missing:

              print(
                  "FEHLER: Erwartete Deklarationen fehlen:"
              )

              for name in missing:
                  print(
                      f"  - {name}"
                  )

              sys.exit(1)

          unknown = sorted(
              set(names) - set(file_map)
          )

          if unknown:

              print(
                  "FEHLER: Unbekannte Top-Level-Deklarationen:"
              )

              for name in unknown:
                  print(
                      f"  - {name}"
                  )

              sys.exit(1)

          package_match = re.search(
              r"(?m)^package\s+[^\n]+$",
              source
          )

          if not package_match:

              print(
                  "FEHLER: package-Deklaration fehlt."
              )

              sys.exit(1)

          package_line = package_match.group(0)

          imports = re.findall(
              r"(?m)^import\s+[^\n]+$",
              source
          )

          header = (
              package_line
              + "\n\n"
          )

          if imports:

              header += (
                  "\n".join(imports)
                  + "\n\n"
              )

          root = Path(
              "app/src/main/java/de/autocheck/app"
          )

          for folder in (
              "data",
              "storage",
              "screens",
              "components",
              "utils",
          ):

              (
                  root / folder
              ).mkdir(
                  parents=True,
                  exist_ok=True
              )

          generated_files = sorted(
              set(
                  file_map.values()
              )
          )

          for relative in generated_files:

              path = (
                  root / relative
              )

              if path.exists():
                  path.unlink()

          grouped = {}

          for name, text in declarations:

              # Top-Level-private ist in Kotlin
              # nur innerhalb derselben Datei sichtbar.
              # Nach der Aufteilung müssen die betroffenen
              # Deklarationen aus anderen Dateien erreichbar sein.

              text = re.sub(
                  r"^((?:@[^\n]+\n)*)private\s+",
                  r"\1",
                  text
              )

              # DetailScaffold benötigt weiterhin
              # die Freigabe für ExperimentalMaterial3Api.
              if name == "DetailScaffold":

                  if "@OptIn" not in text:

                      text = (
                          "@OptIn(ExperimentalMaterial3Api::class)\n"
                          + text
                      )

              relative = file_map[name]

              grouped.setdefault(
                  relative,
                  []
              ).append(text)

          for relative, parts in grouped.items():

              path = (
                  root / relative
              )

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              content = (
                  header
                  + "\n\n".join(parts)
                  + "\n"
              )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

          main_path = (
              root / "MainActivity.kt"
          )

          main_text = (
              main_path.read_text(
                  encoding="utf-8"
              )
          )

          main_names = [
              m.group(1)
              for m in declaration_re.finditer(
                  main_text
              )
          ]

          if main_names != [
              "MainActivity"
          ]:

              print(
                  "FEHLER: MainActivity.kt enthält "
                  "nicht ausschließlich MainActivity."
              )

              print(
                  main_names
              )

              sys.exit(1)

          print("")
          print(
              "========================================"
          )
          print(
              "MODULARISIERUNG VORBEREITET"
          )
          print(
              "========================================"
          )

          for relative in sorted(
              grouped
          ):

              print(
                  f"erstellt: {relative}"
              )

          print("")
          print(
              "Sicherheitsprüfung erfolgreich."
          )
          PY

      - name: Android SDK vorbereiten
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager --version

          sdkmanager "platforms;android-36"

          cp app/build.gradle.kts /tmp/build.gradle.kts.original

          sed -i \
            -e 's/compileSdk = 37/compileSdk = 36/' \
            -e 's/targetSdk = 37/targetSdk = 36/' \
            app/build.gradle.kts

          echo "Temporär für den Test-Build auf Android API 36 umgestellt."

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Modularisiertes Projekt bauen
        run: |
          gradle assembleDebug --stacktrace

      - name: Originale App-Konfiguration wiederherstellen
        if: always()
        run: |
          if [ -f /tmp/build.gradle.kts.original ]; then
            cp /tmp/build.gradle.kts.original app/build.gradle.kts
            echo "Originale app/build.gradle.kts wiederhergestellt."
          else
            echo "Keine temporäre Sicherung vorhanden."
          fi

      - name: Modularisierung nach erfolgreichem Build speichern
        if: success()
        run: |
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/de/autocheck/app

          git commit -m "Modularize AutoCheck CUT2 code"

          git push origin main

      - name: APK hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCheck-CUT2-modular
          path: app/build/outputs/apk/debug/app-debug.apk
