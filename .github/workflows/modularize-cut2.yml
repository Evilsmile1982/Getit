name: AutoCheck CUT2 modularisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CUT2 Baseline prüfen
        run: |
          git fetch --tags --force

          if ! git rev-parse CUT2-BASELINE >/dev/null 2>&1; then
            echo "FEHLER: CUT2-BASELINE wurde nicht gefunden."
            exit 1
          fi

          echo "CUT2-BASELINE gefunden."

      - name: CUT2 Baseline als Quelle verwenden
        run: |
          mkdir -p /tmp/autocheck-baseline

          git show \
            CUT2-BASELINE:app/src/main/java/de/autocheck/app/MainActivity.kt \
            > /tmp/autocheck-baseline/MainActivity.kt

          test -s /tmp/autocheck-baseline/MainActivity.kt

          echo "CUT2 Baseline:"
          wc -l /tmp/autocheck-baseline/MainActivity.kt
          wc -c /tmp/autocheck-baseline/MainActivity.kt

      - name: Kotlin-Datei sicher modularisieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          SOURCE = Path(
              "/tmp/autocheck-baseline/MainActivity.kt"
          )

          TARGET = Path(
              "app/src/main/java/de/autocheck/app"
          )

          source = SOURCE.read_text(
              encoding="utf-8"
          )

          lines = source.splitlines(
              keepends=True
          )

          FILE_MAP = {
              "Background": "components/UiConstants.kt",
              "Surface": "components/UiConstants.kt",
              "Muted": "components/UiConstants.kt",

              "Vehicle": "data/Vehicle.kt",
              "Repair": "data/Repair.kt",
              "Maintenance": "data/Maintenance.kt",
              "Pickerl": "data/Pickerl.kt",
              "TireSet": "data/TireSet.kt",

              "VehicleStore": "storage/VehicleStore.kt",
              "VisitedStore": "storage/VisitedStore.kt",

              "Screen": "screens/Screen.kt",

              "MenuItemData":
                  "components/MenuItemData.kt",

              "MainActivity":
                  "MainActivity.kt",

              "PickerlReceiver":
                  "utils/PickerlReminder.kt",

              "schedulePickerlReminder":
                  "utils/PickerlReminder.kt",

              "cancelPickerlReminder":
                  "utils/PickerlReminder.kt",

              "migrateVehicleName":
                  "utils/VehicleMigration.kt",

              "AutoCheckApp":
                  "AutoCheckApp.kt",

              "HomeScreen":
                  "screens/HomeScreen.kt",

              "VehicleScreen":
                  "screens/VehicleScreen.kt",

              "RepairScreen":
                  "screens/RepairScreen.kt",

              "PickerlScreen":
                  "screens/PickerlScreen.kt",

              "MaintenanceScreen":
                  "screens/MaintenanceScreen.kt",

              "TireScreen":
                  "screens/TireScreen.kt",

              "OverviewScreen":
                  "screens/OverviewScreen.kt",

              "MenuCard":
                  "components/MenuCard.kt",

              "DetailScaffold":
                  "components/DetailScaffold.kt",

              "VehicleImage":
                  "components/VehicleImage.kt",

              "VehicleSelector":
                  "components/VehicleSelector.kt",

              "CardForm":
                  "components/CardForm.kt",

              "FormField":
                  "components/FormField.kt",

              "FormButtons":
                  "components/FormButtons.kt",

              "EmptyCard":
                  "components/EmptyCard.kt",

              "RecordCard":
                  "components/RecordCard.kt",
          }

          EXPECTED = set(FILE_MAP.keys())

          DECLARATION_KIND = {
              "Background": r"(?:val|var)",
              "Surface": r"(?:val|var)",
              "Muted": r"(?:val|var)",

              "Vehicle": r"(?:data\s+class|class)",
              "Repair": r"(?:data\s+class|class)",
              "Maintenance": r"(?:data\s+class|class)",
              "Pickerl": r"(?:data\s+class|class)",
              "TireSet": r"(?:data\s+class|class)",

              "VehicleStore": r"class",
              "VisitedStore": r"class",

              "Screen":
                  r"(?:enum\s+class|sealed\s+class|class)",

              "MenuItemData":
                  r"(?:data\s+class|class)",

              "MainActivity": r"class",
              "PickerlReceiver": r"class",

              "schedulePickerlReminder": r"fun",
              "cancelPickerlReminder": r"fun",
              "migrateVehicleName": r"fun",

              "AutoCheckApp": r"fun",

              "HomeScreen": r"fun",
              "VehicleScreen": r"fun",
              "RepairScreen": r"fun",
              "PickerlScreen": r"fun",
              "MaintenanceScreen": r"fun",
              "TireScreen": r"fun",
              "OverviewScreen": r"fun",

              "MenuCard": r"fun",
              "DetailScaffold": r"fun",
              "VehicleImage": r"fun",
              "VehicleSelector": r"fun",

              "CardForm": r"fun",
              "FormField": r"fun",
              "FormButtons": r"fun",
              "EmptyCard": r"fun",
              "RecordCard": r"fun",
          }

          package_match = re.search(
              r"(?m)^package\s+[^\n]+$",
              source
          )

          if not package_match:
              print(
                  "FEHLER: package-Deklaration fehlt."
              )
              sys.exit(1)

          package_line = package_match.group(0)

          import_lines = re.findall(
              r"(?m)^import\s+[^\n]+$",
              source
          )

          HEADER = (
              package_line
              + "\n\n"
              + "\n".join(import_lines)
              + "\n\n"
          )

          declarations = []

          for name in sorted(
              EXPECTED,
              key=len,
              reverse=True
          ):

              kind = DECLARATION_KIND[name]

              pattern = re.compile(
                  r"(?m)^"
                  r"\s*"
                  r"(?:(?:public|private|protected|internal|"
                  r"abstract|open|final|data|sealed|"
                  r"enum|annotation|value|expect|actual|"
                  r"suspend|inline|operator|infix|tailrec|"
                  r"external|const|override)\s+)*"
                  + kind
                  + r"\s+"
                  + re.escape(name)
                  + r"\b"
              )

              matches = list(
                  pattern.finditer(source)
              )

              if len(matches) == 0:
                  print("")
                  print(
                      "FEHLER: Deklaration nicht gefunden:"
                  )
                  print(
                      "  " + name
                  )
                  sys.exit(1)

              if len(matches) > 1:
                  print("")
                  print(
                      "FEHLER: Deklaration mehrfach gefunden:"
                  )
                  print(
                      "  " + name
                  )
                  print(
                      "  Treffer:",
                      len(matches)
                  )
                  sys.exit(1)

              match = matches[0]

              line_number = source.count(
                  "\n",
                  0,
                  match.start()
              )

              declaration_line = line_number

              annotation_start = declaration_line

              while annotation_start > 0:

                  previous = lines[
                      annotation_start - 1
                  ].strip()

                  if previous.startswith("@"):
                      annotation_start -= 1
                  else:
                      break

              declarations.append(
                  {
                      "name": name,
                      "start": annotation_start,
                      "declaration_start":
                          declaration_line,
                  }
              )

          declarations.sort(
              key=lambda item: item["start"]
          )

          actual_names = [
              item["name"]
              for item in declarations
          ]

          if set(actual_names) != EXPECTED:

              print(
                  "FEHLER: Gefundene Deklarationen stimmen "
                  "nicht mit der erwarteten Liste überein."
              )

              print("Gefunden:")

              for name in actual_names:
                  print(
                      "  - " + name
                  )

              sys.exit(1)

          if len(actual_names) != len(EXPECTED):

              print(
                  "FEHLER: Anzahl der Deklarationen stimmt nicht."
              )

              sys.exit(1)

          for index, declaration in enumerate(
              declarations
          ):

              if index + 1 < len(
                  declarations
              ):

                  declaration["end"] = (
                      declarations[index + 1]["start"]
                  )

              else:

                  declaration["end"] = len(lines)

          for path in TARGET.rglob("*.kt"):

              if "/ui/" in str(path):
                  continue

              path.unlink()

          grouped = {}

          for declaration in declarations:

              name = declaration["name"]

              start = declaration["start"]
              end = declaration["end"]

              text = "".join(
                  lines[start:end]
              ).strip()

              text = re.sub(
                  r"^(\s*@.*\n\s*)?private\s+",
                  r"\1",
                  text,
                  count=1
              )

              relative = FILE_MAP[name]

              grouped.setdefault(
                  relative,
                  []
              ).append(text)

          for relative, parts in grouped.items():

              path = TARGET / relative

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              content = (
                  HEADER
                  + "\n\n".join(parts)
                  + "\n"
              )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

          expected_files = sorted(
              set(FILE_MAP.values())
          )

          for relative in expected_files:

              path = TARGET / relative

              if not path.exists():

                  print(
                      "FEHLER: Datei fehlt:"
                  )

                  print(
                      "  " + relative
                  )

                  sys.exit(1)

              if path.stat().st_size < 50:

                  print(
                      "FEHLER: Datei ist unerwartet klein:"
                  )

                  print(
                      "  " + relative
                  )

                  sys.exit(1)

          forbidden_names = {
              "name",
              "make",
              "model",
              "year",
              "plate",
              "vin",
              "imageUri",
              "id",
              "vehicle",
              "date",
              "mileage",
              "description",
              "cost",
              "workshop",
              "notes",
              "lastDate",
              "nextDate",
              "reminder",
              "season",
              "dimension",
              "brand",
              "dot",
              "tread",
              "condition",
              "storage",
              "title",
              "subtitle",
              "icon",
          }

          generated_names = set()

          for path in TARGET.rglob("*.kt"):

              if "/ui/" in str(path):
                  continue

              text = path.read_text(
                  encoding="utf-8"
              )

              for match in re.finditer(
                  r"(?m)^\s*"
                  r"(?:private\s+|public\s+|protected\s+|internal\s+)*"
                  r"(?:data\s+class|sealed\s+class|enum\s+class|class|object|interface|fun)"
                  r"\s+([A-Za-z_][A-Za-z0-9_]*)\b",
                  text
              ):

                  generated_names.add(
                      match.group(1)
                  )

          accidental = sorted(
              generated_names & forbidden_names
          )

          if accidental:

              print("")

              print(
                  "FEHLER: Feldnamen wurden als eigene "
                  "Top-Level-Deklarationen erkannt:"
              )

              for name in accidental:

                  print(
                      "  - " + name
                  )

              sys.exit(1)

          print("")
          print(
              "=========================================="
          )
          print(
              "MODULARISIERUNG ERFOLGREICH"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "Gefundene echte Top-Level-Deklarationen:"
          )

          for declaration in declarations:

              print(
                  "  - " + declaration["name"]
              )

          print("")
          print(
              "Erzeugte Dateien:"
          )

          for relative in sorted(grouped):

              path = TARGET / relative

              line_count = len(
                  path.read_text(
                      encoding="utf-8"
                  ).splitlines()
              )

              print(
                  f"  {relative}: {line_count} Zeilen"
              )

          print("")
          print(
              "Keine Konstruktorfelder wurden als "
              "Top-Level-Deklarationen erkannt."
          )

          print(
              "Die CUT2-BASELINE wurde unverändert als "
              "Quelle verwendet."
          )

          PY

      - name: Modularisierte Dateien prüfen
        run: |
          echo "Kotlin-Dateien:"
          find app/src/main/java/de/autocheck/app \
            -type f \
            -name "*.kt" \
            | sort

          echo ""
          echo "MainActivity:"
          grep -n \
            "class MainActivity" \
            app/src/main/java/de/autocheck/app/MainActivity.kt

          echo ""
          echo "Vehicle:"
          grep -n \
            "data class Vehicle" \
            app/src/main/java/de/autocheck/app/data/Vehicle.kt

          echo ""
          echo "HomeScreen:"
          grep -n \
            "fun HomeScreen" \
            app/src/main/java/de/autocheck/app/screens/HomeScreen.kt

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Modularisiertes Projekt bauen
        shell: bash
        run: |
          set +e

          gradle assembleDebug --stacktrace --console=plain \
            > /tmp/autocheck-build.log 2>&1

          BUILD_STATUS=$?

          echo ""
          echo "=========================================="
          echo "WICHTIGE BUILD-FEHLER"
          echo "=========================================="

          grep -nE \
            "e: |error: |ERROR: |What went wrong|Execution failed|Unresolved reference|Expecting|Cannot access|Overload resolution ambiguity|Type mismatch|Modifier 'private' is not applicable|Conflicting declarations" \
            /tmp/autocheck-build.log \
            | tail -120 \
            || true

          echo ""
          echo "=========================================="
          echo "LETZTE 120 BUILD-ZEILEN"
          echo "=========================================="

          tail -120 /tmp/autocheck-build.log

          echo ""
          echo "=========================================="
          echo "DATEIEN IM MODULARISIERTEN PROJEKT"
          echo "=========================================="

          find app/src/main/java/de/autocheck/app \
            -type f \
            -name "*.kt" \
            | sort

          echo ""
          echo "Gradle Exit-Code: $BUILD_STATUS"

          exit $BUILD_STATUS

      - name: APK hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCheck-CUT2-modular
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Modularisierung speichern
        if: success()
        run: |
          git status --short

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/de/autocheck/app

          git commit \
            -m "Modularize AutoCheck CUT2 code"

          git push origin main

      - name: Ergebnis
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "AUTO CHECK CUT2 MODULARISIERUNG FERTIG"
          echo "=========================================="
          echo ""
          echo "Build erfolgreich."
          echo "APK wurde erstellt."
          echo "Modularisierte Dateien wurden nach main gepusht."
