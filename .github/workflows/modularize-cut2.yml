name: AutoCheck CUT2 modularisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CUT2 Baseline prüfen
        run: |
          git fetch --tags --force

          if ! git rev-parse CUT2-BASELINE >/dev/null 2>&1; then
            echo "FEHLER: CUT2-BASELINE wurde nicht gefunden."
            exit 1
          fi

          echo "CUT2-BASELINE gefunden."

      - name: CUT2 Baseline als Quelle verwenden
        run: |
          mkdir -p /tmp/autocheck-baseline

          git show \
            CUT2-BASELINE:app/src/main/java/de/autocheck/app/MainActivity.kt \
            > /tmp/autocheck-baseline/MainActivity.kt

          test -s /tmp/autocheck-baseline/MainActivity.kt

          echo "CUT2 Baseline:"
          wc -l /tmp/autocheck-baseline/MainActivity.kt
          wc -c /tmp/autocheck-baseline/MainActivity.kt

      - name: Kotlin-Datei sicher modularisieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          SOURCE = Path(
              "/tmp/autocheck-baseline/MainActivity.kt"
          )

          TARGET = Path(
              "app/src/main/java/de/autocheck/app"
          )

          source = SOURCE.read_text(
              encoding="utf-8"
          )

          lines = source.splitlines(
              keepends=True
          )

          FILE_MAP = {
              "Background":
                  "components/UiConstants.kt",

              "Surface":
                  "components/UiConstants.kt",

              "Muted":
                  "components/UiConstants.kt",

              "Vehicle":
                  "data/Vehicle.kt",

              "Repair":
                  "data/Repair.kt",

              "Maintenance":
                  "data/Maintenance.kt",

              "Pickerl":
                  "data/Pickerl.kt",

              "TireSet":
                  "data/TireSet.kt",

              "VehicleStore":
                  "storage/VehicleStore.kt",

              "VisitedStore":
                  "storage/VisitedStore.kt",

              "Screen":
                  "screens/Screen.kt",

              "MenuItemData":
                  "components/MenuItemData.kt",

              "MainActivity":
                  "MainActivity.kt",

              "PickerlReceiver":
                  "utils/PickerlReminder.kt",

              "schedulePickerlReminder":
                  "utils/PickerlReminder.kt",

              "cancelPickerlReminder":
                  "utils/PickerlReminder.kt",

              "migrateVehicleName":
                  "utils/VehicleMigration.kt",

              "AutoCheckApp":
                  "AutoCheckApp.kt",

              "HomeScreen":
                  "screens/HomeScreen.kt",

              "VehicleScreen":
                  "screens/VehicleScreen.kt",

              "RepairScreen":
                  "screens/RepairScreen.kt",

              "PickerlScreen":
                  "screens/PickerlScreen.kt",

              "MaintenanceScreen":
                  "screens/MaintenanceScreen.kt",

              "TireScreen":
                  "screens/TireScreen.kt",

              "OverviewScreen":
                  "screens/OverviewScreen.kt",

              "MenuCard":
                  "components/MenuCard.kt",

              "DetailScaffold":
                  "components/DetailScaffold.kt",

              "VehicleImage":
                  "components/VehicleImage.kt",

              "VehicleSelector":
                  "components/VehicleSelector.kt",

              "CardForm":
                  "components/CardForm.kt",

              "FormField":
                  "components/FormField.kt",

              "FormButtons":
                  "components/FormButtons.kt",

              "EmptyCard":
                  "components/EmptyCard.kt",

              "RecordCard":
                  "components/RecordCard.kt",
          }

          EXPECTED = set(FILE_MAP.keys())

          KIND = {
              "Background":
                  r"(?:val|var)",

              "Surface":
                  r"(?:val|var)",

              "Muted":
                  r"(?:val|var)",

              "Vehicle":
                  r"(?:data\s+class|class)",

              "Repair":
                  r"(?:data\s+class|class)",

              "Maintenance":
                  r"(?:data\s+class|class)",

              "Pickerl":
                  r"(?:data\s+class|class)",

              "TireSet":
                  r"(?:data\s+class|class)",

              "VehicleStore":
                  r"class",

              "VisitedStore":
                  r"class",

              "Screen":
                  r"(?:enum\s+class|sealed\s+class|class)",

              "MenuItemData":
                  r"(?:data\s+class|class)",

              "MainActivity":
                  r"class",

              "PickerlReceiver":
                  r"class",

              "schedulePickerlReminder":
                  r"fun",

              "cancelPickerlReminder":
                  r"fun",

              "migrateVehicleName":
                  r"fun",

              "AutoCheckApp":
                  r"fun",

              "HomeScreen":
                  r"fun",

              "VehicleScreen":
                  r"fun",

              "RepairScreen":
                  r"fun",

              "PickerlScreen":
                  r"fun",

              "MaintenanceScreen":
                  r"fun",

              "TireScreen":
                  r"fun",

              "OverviewScreen":
                  r"fun",

              "MenuCard":
                  r"fun",

              "DetailScaffold":
                  r"fun",

              "VehicleImage":
                  r"fun",

              "VehicleSelector":
                  r"fun",

              "CardForm":
                  r"fun",

              "FormField":
                  r"fun",

              "FormButtons":
                  r"fun",

              "EmptyCard":
                  r"fun",

              "RecordCard":
                  r"fun",
          }

          package_match = re.search(
              r"(?m)^package\s+[^\n]+$",
              source
          )

          if not package_match:
              print(
                  "FEHLER: package-Deklaration fehlt."
              )
              sys.exit(1)

          package_line = package_match.group(0)

          import_lines = re.findall(
              r"(?m)^import\s+[^\n]+$",
              source
          )

          HEADER = (
              package_line
              + "\n\n"
              + "\n".join(import_lines)
              + "\n\n"
          )

          #
          # --------------------------------------------------
          # Kotlin-Lexer:
          #
          # Wir berechnen die Klammer-Tiefe jeder Zeile.
          # Dadurch werden z.B.
          #
          #     val name: String
          #
          # innerhalb von
          #
          #     data class Vehicle(...)
          #
          # niemals als Top-Level-Deklaration erkannt.
          # --------------------------------------------------
          #

          depth_before = []

          depth = 0

          in_block_comment = False
          in_string = False
          in_char = False
          in_raw_string = False
          escaped = False

          for line in lines:

              depth_before.append(
                  depth
              )

              i = 0

              while i < len(line):

                  ch = line[i]

                  nxt = (
                      line[i + 1]
                      if i + 1 < len(line)
                      else ""
                  )

                  nxt2 = (
                      line[i + 2]
                      if i + 2 < len(line)
                      else ""
                  )

                  if in_raw_string:

                      if (
                          ch == '"'
                          and nxt == '"'
                          and nxt2 == '"'
                      ):
                          in_raw_string = False
                          i += 3
                          continue

                      i += 1
                      continue

                  if in_block_comment:

                      if (
                          ch == "*"
                          and nxt == "/"
                      ):
                          in_block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:

                      if escaped:
                          escaped = False
                          i += 1
                          continue

                      if ch == "\\":
                          escaped = True
                          i += 1
                          continue

                      if ch == '"':
                          in_string = False

                      i += 1
                      continue

                  if in_char:

                      if escaped:
                          escaped = False
                          i += 1
                          continue

                      if ch == "\\":
                          escaped = True
                          i += 1
                          continue

                      if ch == "'":
                          in_char = False

                      i += 1
                      continue

                  if (
                      ch == "/"
                      and nxt == "/"
                  ):
                      break

                  if (
                      ch == "/"
                      and nxt == "*"
                  ):
                      in_block_comment = True
                      i += 2
                      continue

                  if (
                      ch == '"'
                      and nxt == '"'
                      and nxt2 == '"'
                  ):
                      in_raw_string = True
                      i += 3
                      continue

                  if ch == '"':
                      in_string = True
                      i += 1
                      continue

                  if ch == "'":
                      in_char = True
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth < 0:
                          print(
                              "FEHLER: Ungültige Klammerstruktur."
                          )
                          sys.exit(1)

                  i += 1

          if depth != 0:
              print(
                  "FEHLER: Klammer-Tiefe am Dateiende ist "
                  + str(depth)
              )
              sys.exit(1)

          #
          # --------------------------------------------------
          # Nur echte Top-Level-Deklarationen suchen.
          # --------------------------------------------------
          #

          declarations = []

          for index, line in enumerate(lines):

              if depth_before[index] != 0:
                  continue

              for name in EXPECTED:

                  kind = KIND[name]

                  pattern = re.compile(
                      r"^\s*"
                      r"(?:(?:public|private|protected|internal|"
                      r"abstract|open|final|data|sealed|"
                      r"enum|annotation|value|expect|actual|"
                      r"suspend|inline|operator|infix|"
                      r"tailrec|external|const|override)\s+)*"
                      + kind
                      + r"\s+"
                      + re.escape(name)
                      + r"\b"
                  )

                  if pattern.search(line):

                      declarations.append(
                          {
                              "name": name,
                              "line": index
                          }
                      )

                      break

          #
          # Jede erwartete Deklaration genau einmal.
          #

          actual_names = [
              item["name"]
              for item in declarations
          ]

          duplicates = sorted(
              {
                  name
                  for name in actual_names
                  if actual_names.count(name) > 1
              }
          )

          if duplicates:

              print(
                  "FEHLER: Mehrfach erkannte Top-Level-Deklarationen:"
              )

              for name in duplicates:
                  print(
                      "  - " + name
                  )

              sys.exit(1)

          missing = sorted(
              EXPECTED - set(actual_names)
          )

          if missing:

              print(
                  "FEHLER: Top-Level-Deklarationen fehlen:"
              )

              for name in missing:
                  print(
                      "  - " + name
                  )

              sys.exit(1)

          unknown = sorted(
              set(actual_names) - EXPECTED
          )

          if unknown:

              print(
                  "FEHLER: Unbekannte Deklarationen:"
              )

              for name in unknown:
                  print(
                      "  - " + name
                  )

              sys.exit(1)

          #
          # --------------------------------------------------
          # Annotationen vor einer Deklaration bestimmen.
          #
          # Wichtig für:
          #
          # @OptIn(
          #     ExperimentalMaterial3Api::class
          # )
          # @Composable
          # private fun DetailScaffold(...)
          #
          # --------------------------------------------------
          #

          def annotation_start(line_index):

              start = line_index

              cursor = line_index - 1

              while cursor >= 0:

                  stripped = lines[
                      cursor
                  ].strip()

                  if stripped == "":
                      break

                  if stripped.startswith("@"):

                      start = cursor
                      cursor -= 1
                      continue

                  #
                  # Mehrzeilige Annotation, z.B.
                  #
                  # @OptIn(
                  #     Something::class
                  # )
                  #
                  # Wir sind am Ende bei ")".
                  #

                  if stripped == ")":

                      search = cursor

                      while search >= 0:

                          candidate = lines[
                              search
                          ].strip()

                          if candidate.startswith("@"):

                              start = search
                              cursor = search - 1
                              break

                          if candidate == "":
                              search = -1
                              break

                          search -= 1

                      if search == -1:
                          break

                      continue

                  break

              #
              # Falls direkt vor der @OptIn noch
              # eine @Composable steht, ebenfalls aufnehmen.
              #

              while start > 0:

                  previous = lines[
                      start - 1
                  ].strip()

                  if previous.startswith("@"):

                      start -= 1
                      continue

                  if previous == ")":

                      search = start - 1

                      while search >= 0:

                          candidate = lines[
                              search
                          ].strip()

                          if candidate.startswith("@"):

                              start = search
                              break

                          if candidate == "":
                              search = -1
                              break

                          search -= 1

                      if search >= 0:
                          continue

                  break

              return start

          #
          # Annotation-Start für jede Deklaration.
          #

          for declaration in declarations:

              declaration["annotation_start"] = (
                  annotation_start(
                      declaration["line"]
                  )
              )

          declarations.sort(
              key=lambda item: item["line"]
          )

          #
          # --------------------------------------------------
          # Ende bestimmen:
          # immer bis zum Anfang der Annotation
          # der nächsten Top-Level-Deklaration.
          # --------------------------------------------------
          #

          for index, declaration in enumerate(
              declarations
          ):

              if index + 1 < len(
                  declarations
              ):

                  declaration["end"] = (
                      declarations[index + 1][
                          "annotation_start"
                      ]
                  )

              else:

                  declaration["end"] = len(lines)

          #
          # Alte modularisierte Dateien entfernen.
          # Theme.kt bleibt erhalten.
          #

          for path in TARGET.rglob("*.kt"):

              if "/ui/" in str(path):
                  continue

              path.unlink()

          grouped = {}

          #
          # --------------------------------------------------
          # Deklarationen extrahieren.
          # --------------------------------------------------
          #

          for declaration in declarations:

              name = declaration["name"]

              start = declaration[
                  "annotation_start"
              ]

              end = declaration["end"]

              text = "".join(
                  lines[start:end]
              ).strip()

              #
              # Top-Level-private entfernen.
              #
              # Dadurch bleibt die Struktur erhalten,
              # die Funktionen bleiben aber aus anderen
              # Dateien erreichbar.
              #

              text = re.sub(
                  r"^private\s+",
                  "",
                  text,
                  count=1
              )

              #
              # private nach Annotation:
              #
              text = re.sub(
                  r"(^@[^\n]+\n"
                  r"(?:.*\n)*?)private\s+"
                  r"(?=(?:class|fun|val|var)\s+"
                  + re.escape(name)
                  + r"\b)",
                  r"\1",
                  text,
                  count=1
              )

              relative = FILE_MAP[name]

              grouped.setdefault(
                  relative,
                  []
              ).append(text)

          #
          # Dateien schreiben.
          #

          for relative, parts in grouped.items():

              path = TARGET / relative

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              content = (
                  HEADER
                  + "\n\n".join(parts)
                  + "\n"
              )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

          #
          # --------------------------------------------------
          # Sicherheitsprüfung der erzeugten Dateien.
          # --------------------------------------------------
          #

          expected_files = sorted(
              set(FILE_MAP.values())
          )

          for relative in expected_files:

              path = TARGET / relative

              if not path.exists():

                  print(
                      "FEHLER: Datei fehlt:"
                  )

                  print(
                      "  " + relative
                  )

                  sys.exit(1)

              if path.stat().st_size < 50:

                  print(
                      "FEHLER: Datei ist unerwartet klein:"
                  )

                  print(
                      "  " + relative
                  )

                  sys.exit(1)

          #
          # Es darf keine Datei geben, die versehentlich
          # nur ein Konstruktorfeld enthält.
          #

          forbidden_files = {
              "name.kt",
              "make.kt",
              "model.kt",
              "year.kt",
              "plate.kt",
              "vin.kt",
              "imageUri.kt",
              "id.kt",
              "vehicle.kt",
              "date.kt",
              "mileage.kt",
              "description.kt",
              "cost.kt",
              "workshop.kt",
              "notes.kt",
              "lastDate.kt",
              "nextDate.kt",
              "reminder.kt",
              "season.kt",
              "dimension.kt",
              "brand.kt",
              "dot.kt",
              "tread.kt",
              "condition.kt",
              "storage.kt",
              "title.kt",
              "subtitle.kt",
              "icon.kt",
          }

          for path in TARGET.rglob("*.kt"):

              if path.name in forbidden_files:

                  print(
                      "FEHLER: Falsche Kotlin-Datei erzeugt:"
                  )

                  print(
                      "  " + str(path)
                  )

                  sys.exit(1)

          #
          # DetailScaffold muss seine vollständige
          # @OptIn-Annotation enthalten.
          #

          detail_path = (
              TARGET
              / "components"
              / "DetailScaffold.kt"
          )

          detail_text = detail_path.read_text(
              encoding="utf-8"
          )

          if (
              "ExperimentalMaterial3Api::class"
              not in detail_text
          ):

              print(
                  "FEHLER: @OptIn für DetailScaffold fehlt."
              )

              sys.exit(1)

          #
          # MenuCard darf nicht mit einer offenen
          # Annotation enden.
          #

          menu_path = (
              TARGET
              / "components"
              / "MenuCard.kt"
          )

          menu_text = menu_path.read_text(
              encoding="utf-8"
          )

          if menu_text.rstrip().endswith(
              "@OptIn("
          ):

              print(
                  "FEHLER: MenuCard endet mit einer "
                  "unvollständigen Annotation."
              )

              sys.exit(1)

          #
          # Übersicht.
          #

          print("")
          print(
              "=========================================="
          )
          print(
              "MODULARISIERUNG ERFOLGREICH"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "Echte Top-Level-Deklarationen:"
          )

          for declaration in declarations:

              print(
                  "  - "
                  + declaration["name"]
              )

          print("")
          print(
              "Erzeugte Dateien:"
          )

          for relative in sorted(
              grouped
          ):

              path = TARGET / relative

              count = len(
                  path.read_text(
                      encoding="utf-8"
                  ).splitlines()
              )

              print(
                  f"  {relative}: {count} Zeilen"
              )

          print("")
          print(
              "Kotlin-Klammerstruktur geprüft."
          )

          print(
              "Top-Level-Deklarationen geprüft."
          )

          print(
              "Mehrzeilige Annotationen geprüft."
          )

          print(
              "CUT2-BASELINE unverändert als Quelle verwendet."
          )

          PY

      - name: Modularisierte Dateien prüfen
        run: |
          echo ""
          echo "=========================================="
          echo "ERZEUGTE KOTLIN-DATEIEN"
          echo "=========================================="

          find app/src/main/java/de/autocheck/app \
            -type f \
            -name "*.kt" \
            | sort

          echo ""
          echo "=========================================="
          echo "DetailScaffold"
          echo "=========================================="

          grep -n \
            "ExperimentalMaterial3Api" \
            app/src/main/java/de/autocheck/app/components/DetailScaffold.kt

          echo ""
          echo "=========================================="
          echo "MenuCard Ende"
          echo "=========================================="

          tail -20 \
            app/src/main/java/de/autocheck/app/components/MenuCard.kt

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Modularisiertes Projekt bauen
        shell: bash
        run: |
          set +e

          gradle assembleDebug \
            --stacktrace \
            --console=plain \
            > /tmp/autocheck-build.log 2>&1

          BUILD_STATUS=$?

          echo ""
          echo "=========================================="
          echo "WICHTIGE BUILD-FEHLER"
          echo "=========================================="

          grep -nE \
            "e: |error: |ERROR: |What went wrong|Execution failed|Unresolved reference|Expecting|Cannot access|Overload resolution ambiguity|Type mismatch|Conflicting declarations" \
            /tmp/autocheck-build.log \
            | tail -160 \
            || true

          echo ""
          echo "=========================================="
          echo "LETZTE BUILD-ZEILEN"
          echo "=========================================="

          tail -160 \
            /tmp/autocheck-build.log

          echo ""
          echo "=========================================="
          echo "GRADLE EXIT-CODE"
          echo "=========================================="

          echo "$BUILD_STATUS"

          exit $BUILD_STATUS

      - name: APK hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCheck-CUT2-modular
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Modularisierung speichern
        if: success()
        run: |
          git status --short

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/de/autocheck/app

          git commit \
            -m "Modularize AutoCheck CUT2 code"

          git push origin main

      - name: Ergebnis
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "AUTO CHECK CUT2 MODULARISIERUNG FERTIG"
          echo "=========================================="
          echo ""
          echo "Build erfolgreich."
          echo "APK wurde erstellt."
          echo "Modularisierte Dateien wurden nach main gepusht."
