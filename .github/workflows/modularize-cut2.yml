name: AutoCheck CUT2 modularisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CUT2 Baseline prüfen
        run: |
          git fetch --tags --force

          if ! git rev-parse CUT2-BASELINE >/dev/null 2>&1; then
            echo "FEHLER: CUT2-BASELINE wurde nicht gefunden."
            exit 1
          fi

          echo "CUT2-BASELINE gefunden."

      - name: CUT2 Baseline als Quelle verwenden
        run: |
          mkdir -p /tmp/autocheck-baseline

          git show \
            CUT2-BASELINE:app/src/main/java/de/autocheck/app/MainActivity.kt \
            > /tmp/autocheck-baseline/MainActivity.kt

          test -s /tmp/autocheck-baseline/MainActivity.kt

          echo "CUT2 Baseline MainActivity.kt:"
          wc -l /tmp/autocheck-baseline/MainActivity.kt
          wc -c /tmp/autocheck-baseline/MainActivity.kt

      - name: Kotlin-Datei sicher modularisieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          SOURCE = Path(
              "/tmp/autocheck-baseline/MainActivity.kt"
          )

          TARGET = Path(
              "app/src/main/java/de/autocheck/app"
          )

          source = SOURCE.read_text(
              encoding="utf-8"
          )

          lines = source.splitlines(
              keepends=True
          )

          # ---------------------------------------------------------
          # Erwartete Zuordnung
          # ---------------------------------------------------------

          FILE_MAP = {
              "Background": "components/UiConstants.kt",
              "Surface": "components/UiConstants.kt",
              "Muted": "components/UiConstants.kt",

              "Vehicle": "data/Vehicle.kt",
              "Repair": "data/Repair.kt",
              "Maintenance": "data/Maintenance.kt",
              "Pickerl": "data/Pickerl.kt",
              "TireSet": "data/TireSet.kt",

              "VehicleStore": "storage/VehicleStore.kt",
              "VisitedStore": "storage/VisitedStore.kt",

              "Screen": "screens/Screen.kt",

              "MenuItemData":
                  "components/MenuItemData.kt",

              "MainActivity":
                  "MainActivity.kt",

              "PickerlReceiver":
                  "utils/PickerlReminder.kt",

              "schedulePickerlReminder":
                  "utils/PickerlReminder.kt",

              "cancelPickerlReminder":
                  "utils/PickerlReminder.kt",

              "migrateVehicleName":
                  "utils/VehicleMigration.kt",

              "AutoCheckApp":
                  "AutoCheckApp.kt",

              "HomeScreen":
                  "screens/HomeScreen.kt",

              "VehicleScreen":
                  "screens/VehicleScreen.kt",

              "RepairScreen":
                  "screens/RepairScreen.kt",

              "PickerlScreen":
                  "screens/PickerlScreen.kt",

              "MaintenanceScreen":
                  "screens/MaintenanceScreen.kt",

              "TireScreen":
                  "screens/TireScreen.kt",

              "OverviewScreen":
                  "screens/OverviewScreen.kt",

              "MenuCard":
                  "components/MenuCard.kt",

              "DetailScaffold":
                  "components/DetailScaffold.kt",

              "VehicleImage":
                  "components/VehicleImage.kt",

              "VehicleSelector":
                  "components/VehicleSelector.kt",

              "CardForm":
                  "components/CardForm.kt",

              "FormField":
                  "components/FormField.kt",

              "FormButtons":
                  "components/FormButtons.kt",

              "EmptyCard":
                  "components/EmptyCard.kt",

              "RecordCard":
                  "components/RecordCard.kt",
          }

          EXPECTED = set(FILE_MAP.keys())

          # ---------------------------------------------------------
          # Package und Imports
          # ---------------------------------------------------------

          package_match = re.search(
              r"(?m)^package\s+[^\n]+$",
              source
          )

          if not package_match:
              print(
                  "FEHLER: package-Deklaration fehlt."
              )
              sys.exit(1)

          package_line = package_match.group(0)

          import_lines = re.findall(
              r"(?m)^import\s+[^\n]+$",
              source
          )

          HEADER = (
              package_line
              + "\n\n"
              + "\n".join(import_lines)
              + "\n\n"
          )

          # ---------------------------------------------------------
          # Kotlin-Lexer:
          #
          # Ermittelt die geschweifte Klammer-Tiefe pro Zeile.
          # Strings, Char-Literale und Kommentare werden ignoriert.
          # Dadurch werden verschachtelte Funktionen/Klassen nicht
          # fälschlich als Top-Level-Deklarationen erkannt.
          # ---------------------------------------------------------

          depth_before_line = []

          depth = 0
          in_block_comment = False
          in_string = False
          in_char = False
          escaped = False

          for line in lines:

              depth_before_line.append(
                  depth
              )

              i = 0

              while i < len(line):

                  ch = line[i]

                  nxt = (
                      line[i + 1]
                      if i + 1 < len(line)
                      else ""
                  )

                  if in_block_comment:

                      if ch == "*" and nxt == "/":
                          in_block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:

                      if escaped:
                          escaped = False
                          i += 1
                          continue

                      if ch == "\\":
                          escaped = True
                          i += 1
                          continue

                      if ch == '"':
                          in_string = False

                      i += 1
                      continue

                  if in_char:

                      if escaped:
                          escaped = False
                          i += 1
                          continue

                      if ch == "\\":
                          escaped = True
                          i += 1
                          continue

                      if ch == "'":
                          in_char = False

                      i += 1
                      continue

                  if ch == "/" and nxt == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if ch == "/" and nxt == "/":
                      break

                  if ch == '"':
                      in_string = True
                      i += 1
                      continue

                  if ch == "'":
                      in_char = True
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth < 0:
                          print(
                              "FEHLER: Ungültige Klammerstruktur."
                          )
                          sys.exit(1)

                  i += 1

          if depth != 0:
              print(
                  "FEHLER: Klammer-Tiefe am Dateiende ist "
                  + str(depth)
              )
              sys.exit(1)

          # ---------------------------------------------------------
          # Top-Level-Deklarationen erkennen
          # ---------------------------------------------------------

          declaration_pattern = re.compile(
              r"""
              ^
              \s*
              (?:
                  public
                  |private
                  |protected
                  |internal
                  |abstract
                  |open
                  |final
                  |data
                  |sealed
                  |enum
                  |annotation
                  |value
                  |expect
                  |actual
                  |suspend
                  |inline
                  |operator
                  |infix
                  |tailrec
                  |external
                  |const
                  |override
              )
              \s+
              |
              ^
              \s*
              """,
              re.VERBOSE
          )

          declaration_name_pattern = re.compile(
              r"""
              ^
              \s*
              (?:
                  (?:
                      public|private|protected|internal|
                      abstract|open|final|data|sealed|
                      enum|annotation|value|expect|actual|
                      suspend|inline|operator|infix|
                      tailrec|external|const|override
                  )
                  \s+
              )*
              (?:
                  class
                  |interface
                  |object
                  |fun
                  |val
                  |var
                  |typealias
              )
              \s+
              ([A-Za-z_][A-Za-z0-9_]*)
              \b
              """,
              re.VERBOSE
          )

          # ---------------------------------------------------------
          # Annotation-Block erkennen
          # ---------------------------------------------------------

          def annotation_paren_balance(text):
              balance = 0

              in_string = False
              in_char = False
              escaped = False

              for i, ch in enumerate(text):

                  if in_string:

                      if escaped:
                          escaped = False
                          continue

                      if ch == "\\":
                          escaped = True
                          continue

                      if ch == '"':
                          in_string = False

                      continue

                  if in_char:

                      if escaped:
                          escaped = False
                          continue

                      if ch == "\\":
                          escaped = True
                          continue

                      if ch == "'":
                          in_char = False

                      continue

                  if ch == '"':
                      in_string = True
                      continue

                  if ch == "'":
                      in_char = True
                      continue

                  if ch == "(":
                      balance += 1

                  elif ch == ")":
                      balance -= 1

              return balance

          # ---------------------------------------------------------
          # Deklarationsstarts
          # ---------------------------------------------------------

          declarations = []

          pending_annotation_start = None
          i = 0

          while i < len(lines):

              line = lines[i]

              if depth_before_line[i] != 0:
                  i += 1
                  continue

              stripped = line.strip()

              # ---------------------------------------------
              # Top-Level Annotation
              # ---------------------------------------------

              if stripped.startswith("@"):

                  if pending_annotation_start is None:
                      pending_annotation_start = i

                  balance = 0

                  j = i

                  while j < len(lines):

                      balance += annotation_paren_balance(
                          lines[j]
                      )

                      j += 1

                      if balance <= 0:
                          break

                  i = j
                  continue

              # ---------------------------------------------
              # Top-Level Deklaration
              # ---------------------------------------------

              match = declaration_name_pattern.match(
                  line
              )

              if match:

                  name = match.group(1)

                  if pending_annotation_start is not None:
                      start_line = (
                          pending_annotation_start
                      )
                  else:
                      start_line = i

                  declarations.append(
                      {
                          "name": name,
                          "start": start_line,
                      }
                  )

                  pending_annotation_start = None

              else:

                  # Eine leere Zeile beendet einen
                  # nicht verwendeten Annotation-Puffer.
                  if (
                      pending_annotation_start is not None
                      and stripped == ""
                  ):
                      pending_annotation_start = None

              i += 1

          # ---------------------------------------------------------
          # Prüfung der Deklarationen
          # ---------------------------------------------------------

          actual_names = [
              d["name"]
              for d in declarations
          ]

          print(
              "Gefundene Top-Level-Deklarationen:"
          )

          for name in actual_names:
              print(
                  "  - " + name
              )

          actual_set = set(
              actual_names
          )

          missing = sorted(
              EXPECTED - actual_set
          )

          unknown = sorted(
              actual_set - EXPECTED
          )

          if missing:

              print("")
              print(
                  "FEHLER: Erwartete Deklarationen fehlen:"
              )

              for name in missing:
                  print(
                      "  - " + name
                  )

              sys.exit(1)

          if unknown:

              print("")
              print(
                  "FEHLER: Unbekannte Top-Level-Deklarationen:"
              )

              for name in unknown:
                  print(
                      "  - " + name
                  )

              sys.exit(1)

          if len(actual_names) != len(EXPECTED):

              print("")
              print(
                  "FEHLER: Anzahl der Deklarationen stimmt nicht."
              )

              print(
                  "Erwartet:",
                  len(EXPECTED)
              )

              print(
                  "Gefunden:",
                  len(actual_names)
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Start/Ende bestimmen
          # ---------------------------------------------------------

          for index, declaration in enumerate(
              declarations
          ):

              start_line = declaration["start"]

              if index + 1 < len(declarations):

                  end_line = (
                      declarations[index + 1]["start"]
                  )

              else:

                  end_line = len(lines)

              declaration["end"] = end_line

          # ---------------------------------------------------------
          # Dateien vorbereiten
          # ---------------------------------------------------------

          for relative in set(
              FILE_MAP.values()
          ):

              path = (
                  TARGET / relative
              )

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              if path.exists():
                  path.unlink()

          grouped = {}

          # ---------------------------------------------------------
          # Deklarationen extrahieren
          # ---------------------------------------------------------

          for declaration in declarations:

              name = declaration["name"]

              start = declaration["start"]
              end = declaration["end"]

              text = "".join(
                  lines[start:end]
              ).strip()

              # -------------------------------------------------
              # Top-Level-private entfernen.
              #
              # Innerhalb der extrahierten Klasse/Funktion bleiben
              # private Member unverändert.
              # -------------------------------------------------

              text = re.sub(
                  r"^(\s*(?:@[^\n]+\n\s*)*)(private\s+)",
                  r"\1",
                  text,
                  count=1
              )

              relative = FILE_MAP[name]

              grouped.setdefault(
                  relative,
                  []
              ).append(text)

          # ---------------------------------------------------------
          # Dateien schreiben
          # ---------------------------------------------------------

          for relative, parts in grouped.items():

              path = (
                  TARGET / relative
              )

              content = (
                  HEADER
                  + "\n\n".join(parts)
                  + "\n"
              )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

          # ---------------------------------------------------------
          # MainActivity muss ausschließlich MainActivity enthalten.
          # ---------------------------------------------------------

          main_path = (
              TARGET / "MainActivity.kt"
          )

          main_content = (
              main_path.read_text(
                  encoding="utf-8"
              )
          )

          main_names = [
              d["name"]
              for d in declarations
              if FILE_MAP[d["name"]]
              == "MainActivity.kt"
          ]

          if main_names != [
              "MainActivity"
          ]:

              print(
                  "FEHLER: MainActivity-Zuordnung ist falsch:"
              )

              print(
                  main_names
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Annotationen prüfen.
          # Die Baseline und die erzeugten Dateien müssen dieselbe
          # Anzahl an Top-Level-Annotationen enthalten.
          # ---------------------------------------------------------

          original_top_annotations = 0
          generated_top_annotations = 0

          for declaration in declarations:

              start = declaration["start"]

              line = lines[start].lstrip()

              if line.startswith("@"):
                  original_top_annotations += 1

          for relative in grouped:

              path = (
                  TARGET / relative
              )

              content = path.read_text(
                  encoding="utf-8"
              )

              generated_top_annotations += len(
                  re.findall(
                      r"(?m)^\s*@(?:Composable|OptIn)\b",
                      content
                  )
              )

          # @Suppress innerhalb von Funktionen ist absichtlich
          # nicht Teil dieser Prüfung.

          if generated_top_annotations == 0:

              print(
                  "FEHLER: Top-Level-Annotationen "
                  "wurden nicht übertragen."
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Keine alte MainActivity-Datei mit zusätzlichem Inhalt
          # ---------------------------------------------------------

          if len(main_content.strip()) < 100:

              print(
                  "FEHLER: MainActivity.kt ist unerwartet klein."
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Ergebnis ausgeben
          # ---------------------------------------------------------

          print("")
          print(
              "=========================================="
          )
          print(
              "MODULARISIERUNG ERFOLGREICH VORBEREITET"
          )
          print(
              "=========================================="
          )

          for relative in sorted(grouped):

              path = (
                  TARGET / relative
              )

              line_count = len(
                  path.read_text(
                      encoding="utf-8"
                  ).splitlines()
              )

              print(
                  f"{relative}: {line_count} Zeilen"
              )

          print("")
          print(
              "Alle erwarteten Top-Level-Deklarationen "
              "wurden gefunden."
          )

          print(
              "Die Baseline wurde als Quelle verwendet."
          )

          print(
              "Der eigentliche Git-Push erfolgt erst "
              "nach erfolgreichem Android-Build."
          )

          PY

      - name: Modularisierte Dateien prüfen
        run: |
          echo "Erzeuge Dateiliste:"
          find app/src/main/java/de/autocheck/app \
            -type f \
            -name "*.kt" \
            | sort

          echo ""
          echo "MainActivity:"
          grep -n \
            "class MainActivity" \
            app/src/main/java/de/autocheck/app/MainActivity.kt

          echo ""
          echo "Composable-Anmerkungen:"
          grep -R \
            -n \
            "@Composable" \
            app/src/main/java/de/autocheck/app \
            | head -30

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Modularisiertes Projekt bauen
        run: |
          gradle assembleDebug --stacktrace

      - name: APK hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCheck-CUT2-modular
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Modularisierung speichern
        if: success()
        run: |
          git status --short

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/de/autocheck/app

          git commit \
            -m "Modularize AutoCheck CUT2 code"

          git push origin main

      - name: Ergebnis
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "AUTO CHECK CUT2 MODULARISIERUNG FERTIG"
          echo "=========================================="
          echo ""
          echo "Build erfolgreich."
          echo "APK wurde erstellt."
          echo "Modularisierte Dateien wurden nach main gepusht."
