name: AutoCheck Projekt entpacken

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: ZIP prüfen und entpacken
        run: |
          file AutoCheck-Projekt.zip
          unzip -t AutoCheck-Projekt.zip
          mkdir extracted
          unzip -o AutoCheck-Projekt.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted AutoCheck-Projekt.zip

      - name: Dateien speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add AutoCheck project" || echo "Keine Änderungen"
          git push
